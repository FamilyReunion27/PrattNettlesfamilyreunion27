<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pratt & Nettles Family Reunion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --ink: #211C14;
    --ink-dim: #7A6F5C;
    --bg: #F4EDDD;
    --bg-raised: #FFFFFF;
    --bg-card: #FFFFFF;
    --gold: #B5892C;
    --gold-dim: #8F6D22;
    --rose: #8C2F2F;
    --line: rgba(33,28,20,0.14);
    --radius: 6px;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100%; }

  h1, h2, h3, .display {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
  }
  .script {
    font-family: 'Yellowtail', cursive;
    text-transform: none;
    letter-spacing: 0;
    color: var(--gold);
  }

  a { color: inherit; }
  button { font-family: inherit; }

  /* ---------- Top nav ---------- */
  header.topbar {
    position: sticky;
    top: 0;
    padding-top: env(safe-area-inset-top, 0px);
    background: rgba(244,237,221,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    z-index: 50;
  }
  .topbar-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 14px 20px 0 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.05rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand span { color: var(--gold); }
  nav.tabs {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
    padding: 12px 20px 0 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 0.92rem;
    font-weight: 500;
    padding: 8px 4px 12px 4px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab-btn.active {
    color: var(--ink);
    border-bottom-color: var(--gold);
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 64px 20px;
  }
  section.view { display: none; }
  section.view.active { display: block; }

  /* ---------- Home ---------- */
  .hero {
    padding: 8px 0 28px 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .hero { text-align: center; }
  .crest {
    font-size: 1.8rem;
    margin-bottom: 6px;
  }
  .eyebrow {
    color: var(--gold);
    font-size: 0.82rem;
    margin-bottom: 10px;
  }
  .hero h1 {
    font-size: clamp(2.1rem, 10vw, 3.1rem);
    line-height: 1.02;
  }
  .tagline {
    margin-top: 8px;
    font-size: 1rem;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
  }
  .photo-frame {
    margin: 22px auto 8px auto;
    max-width: 320px;
    border: 6px solid #fff;
    outline: 2px solid var(--gold);
    outline-offset: 2px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(33,28,20,0.18);
  }
  .photo-frame img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: 50% 50%;
  }
  .photo-caption {
    font-size: 0.85rem;
    color: var(--ink-dim);
    font-style: italic;
    margin-bottom: 6px;
  }
  .hero .desc {
    margin: 14px auto 0 auto;
    text-align: left;
  }
  .fact-row { justify-content: center; }
  .countdown-wrap { justify-content: center; }
  .hero > div[style] { justify-content: center; }
  .hero .desc {
    margin-top: 14px;
    color: var(--ink-dim);
    font-size: 1rem;
    line-height: 1.55;
    max-width: 56ch;
  }
  .fact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 22px;
  }
  .fact {
    min-width: 120px;
  }
  .fact .k {
    font-size: 0.75rem;
    color: var(--ink-dim);
    margin-bottom: 3px;
  }
  .fact .v {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.15rem;
  }
  .countdown-wrap {
    margin-top: 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .count-box {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 16px;
    text-align: center;
    min-width: 64px;
  }
  .count-box .num {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--gold);
  }
  .count-box .lbl {
    font-size: 0.68rem;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .link-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 7px 14px;
    border-radius: var(--radius);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .link-btn:hover { border-color: var(--gold-dim); }
  .primary-btn {
    background: var(--gold);
    border: none;
    color: #1B2A1F;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.5; cursor: default; }
  .primary-btn:hover:not(:disabled) { background: var(--gold-dim); }

  /* edit form */
  .edit-panel {
    margin-top: 20px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    display: none;
  }
  .edit-panel.open { display: block; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-dim);
    margin-bottom: 5px;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 9px 10px;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 0.92rem;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  /* ---------- Section headers ---------- */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 10px;
  }
  .section-head h2 { font-size: 1.4rem; }
  .muted-note { color: var(--ink-dim); font-size: 0.85rem; margin-top: -8px; margin-bottom: 18px; }

  /* ---------- Photo wall ---------- */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    align-items: start;
  }
  .photo-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .photo-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
  }
  .photo-card .cap {
    padding: 8px 10px 10px 10px;
    font-size: 0.78rem;
    color: var(--ink-dim);
  }
  .photo-card .cap b { color: var(--ink); font-weight: 600; }
  .empty-state {
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 30px 18px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.9rem;
  }
  input[type="file"] { display: none; }

  /* ---------- Board ---------- */
  .msg-form {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 22px;
  }
  .msg {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .msg:last-child { border-bottom: none; }
  .msg .who {
    font-weight: 600;
    font-size: 0.9rem;
  }
  .msg .who .rose { color: var(--rose); }
  .msg .when { font-size: 0.72rem; color: var(--ink-dim); margin-left: 8px; }
  .msg .text { margin-top: 5px; font-size: 0.93rem; line-height: 1.5; color: var(--ink); }

  /* ---------- Comments / replies ---------- */
  .item-comments {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  .comment-row {
    font-size: 0.76rem;
    line-height: 1.4;
    margin-bottom: 5px;
    color: var(--ink);
    word-break: break-word;
  }
  .comment-row b { font-weight: 600; }
  .comment-row .when { color: var(--ink-dim); font-size: 0.65rem; margin-left: 5px; }
  .comment-form {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .comment-form input[type="text"] {
    flex: 1;
    min-width: 0;
    font-size: 0.78rem;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  .comment-form button {
    font-size: 0.78rem;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--gold);
    background: var(--gold);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  .photo-card .item-comments { margin-left: 10px; margin-right: 10px; margin-bottom: 10px; }

  /* ---------- Video chat ---------- */
  .video-frame-box {
    width: 100%;
    height: 70vh;
    min-height: 420px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--line);
    background: #000;
  }

  /* ---------- Two Truths & a Lie ---------- */
  .toggle-row { display: flex; gap: 8px; margin-top: 4px; }
  .toggle-opt {
    flex: 1;
    text-align: center;
    padding: 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 0.88rem;
    cursor: pointer;
    color: var(--ink-dim);
  }
  .toggle-opt.sel {
    background: rgba(181,137,44,0.14);
    border-color: var(--gold);
    color: var(--ink);
    font-weight: 700;
  }
  .tt-submit {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .tt-submit h3, .leaderboard h3 {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    font-size: 0.95rem;
    color: var(--gold-dim);
    margin-bottom: 12px;
  }
  .tt-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .tt-card .tt-who {
    font-weight: 700;
    font-size: 0.92rem;
    margin-bottom: 10px;
  }
  .tt-card .q-option { margin-bottom: 7px; }
  .tt-card .tt-result {
    font-size: 0.85rem;
    color: var(--gold-dim);
    font-weight: 600;
    margin-top: 4px;
  }

  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: #1B2A1F;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  /* ---------- Schedule ---------- */
  .day-block { margin-bottom: 26px; }
  .day-block h3 {
    font-size: 1.05rem;
    color: var(--gold);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .event-row {
    display: flex;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .event-row:last-child { border-bottom: none; }
  .event-time {
    min-width: 84px;
    font-size: 0.82rem;
    color: var(--ink-dim);
    padding-top: 1px;
  }
  .event-body .event-title {
    font-weight: 600;
    font-size: 0.95rem;
  }
  .event-body .event-loc {
    font-size: 0.84rem;
    color: var(--ink-dim);
    margin-top: 2px;
  }
  .event-body .event-flag {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.72rem;
    color: var(--rose);
    border: 1px solid rgba(140,47,47,0.4);
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* ---------- Payment / registration callout ---------- */
  .info-callout {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-top: 22px;
  }
  .info-callout h3 {
    font-size: 0.95rem;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .info-callout .fee-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.88rem;
    padding: 5px 0;
    color: var(--ink-dim);
  }
  .info-callout .fee-row b { color: var(--ink); font-weight: 500; }
  .info-callout p {
    font-size: 0.85rem;
    color: var(--ink-dim);
    line-height: 1.55;
    margin: 10px 0 0 0;
  }
  .info-callout .reg-btn {
    margin-top: 14px;
  }

  /* ---------- Games ---------- */
  .game-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .game-tab-btn {
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
  }
  .game-tab-btn.active {
    border-color: var(--gold);
    color: var(--ink);
    background: rgba(181,137,44,0.12);
  }
  .game-pane { display: none; }
  .game-pane.active { display: block; }

  .trivia-q-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin: 14px 0 22px 0;
  }
  .trivia-q-card .q-title {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .trivia-q-card .q-text {
    font-family: 'Anton', sans-serif;
    font-size: 1.15rem;
    text-transform: none;
    margin-bottom: 14px;
    line-height: 1.25;
  }
  .q-option {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    color: var(--ink);
  }
  .q-option.correct { border-color: var(--gold); background: rgba(181,137,44,0.14); }
  .q-option.wrong { border-color: var(--rose); background: rgba(140,47,47,0.12); }
  .q-option:disabled { cursor: default; }
  .q-done { font-size: 0.88rem; color: var(--gold-dim); font-weight: 600; }
  .trivia-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .trivia-nav .link-btn:disabled { opacity: 0.4; cursor: default; }

  .leaderboard { margin-top: 8px; }
  .leaderboard h3 {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    font-size: 0.95rem;
    color: var(--gold-dim);
    margin-bottom: 10px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank {
    font-family: 'Anton', sans-serif;
    color: var(--gold);
    width: 22px;
  }
  .lb-name { flex: 1; }
  .lb-score { font-weight: 700; }

  .superlative-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .superlative-card .title {
    font-family: 'Anton', sans-serif;
    font-size: 1rem;
    margin-bottom: 10px;
  }
  .vote-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .vote-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-family: inherit;
    color: var(--ink);
  }
  .vote-results { margin-top: 8px; }
  .vote-result-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--ink-dim);
    padding: 3px 0;
  }
  .vote-result-row b { color: var(--ink); }

  /* ---------- Family Tree ---------- */
  .tree-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tree-toolbar input {
    flex: 1;
    min-width: 140px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 12px;
    font-family: inherit;
    color: var(--ink);
  }
  .tree-add-panel {
    display: none;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 24px;
  }
  .tree-add-panel.open { display: block; }
  .tree-add-panel h3 {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    font-size: 0.95rem;
    color: var(--gold-dim);
    margin-bottom: 14px;
  }
  .tree-add-panel select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 9px 10px;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 0.92rem;
  }
  .field-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 0.88rem;
    color: var(--ink-dim);
  }

  .gen-block { margin-bottom: 30px; }
  .gen-label {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    font-size: 0.85rem;
    color: var(--gold);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .gen-line {
    height: 1px;
    background: var(--line);
    margin-bottom: 14px;
  }
  .person-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .person-card {
    flex: 0 0 auto;
    width: 128px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 10px;
    text-align: center;
    cursor: pointer;
  }
  .person-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin: 0 auto 8px auto;
    background: var(--bg);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Anton', sans-serif;
    color: var(--gold-dim);
    font-size: 1.1rem;
    overflow: hidden;
  }
  .person-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .person-name {
    font-size: 0.82rem;
    font-weight: 600;
    line-height: 1.2;
  }
  .person-years {
    font-size: 0.7rem;
    color: var(--ink-dim);
    margin-top: 2px;
  }
  .person-parents {
    font-size: 0.62rem;
    color: var(--gold-dim);
    margin-top: 4px;
    line-height: 1.15;
    white-space: normal;
  }
  .spouse-pair {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .spouse-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
    align-self: center;
  }
  .spouse-icon { font-size: 1.05rem; line-height: 1; }
  .spouse-tag {
    font-size: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--gold-dim);
    margin-top: 2px;
    white-space: nowrap;
  }

  .person-detail {
    background: #fff;
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 24px;
  }
  .person-detail .pd-head {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-bottom: 12px;
  }
  .person-detail .pd-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; color: var(--gold-dim); font-size: 1.3rem;
    overflow: hidden; flex-shrink: 0;
  }
  .person-detail .pd-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .person-detail .pd-name {
    font-family: 'Anton', sans-serif;
    font-size: 1.15rem;
    text-transform: none;
  }
  .person-detail .pd-years { font-size: 0.82rem; color: var(--ink-dim); }
  .person-detail .pd-bio { font-size: 0.9rem; line-height: 1.55; margin-bottom: 12px; }
  .pd-rel-row { font-size: 0.84rem; margin-bottom: 6px; color: var(--ink-dim); }
  .pd-rel-row b { color: var(--ink); font-weight: 600; }
  .pd-rel-row a { color: var(--gold-dim); cursor: pointer; text-decoration: underline; }
  .pd-close { margin-top: 10px; }

  /* ---------- In Loving Memory ---------- */
  .memory-hero {
    text-align: center;
    padding: 26px 16px 30px 16px;
    background: var(--ink);
    border-radius: var(--radius);
    margin-bottom: 24px;
  }
  .memory-hero .script {
    font-size: 2.1rem;
    color: var(--gold);
    display: block;
    line-height: 1.1;
  }
  .memory-hero p {
    color: #C9C2AF;
    font-size: 0.88rem;
    margin-top: 8px;
    max-width: 42ch;
    margin-left: auto;
    margin-right: auto;
  }

  .memory-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .memory-card {
    background: var(--ink);
    border: 1px solid rgba(231,196,110,0.25);
    border-radius: var(--radius);
    padding: 20px 18px;
    color: #F3EFE1;
  }
  .memory-card .mc-head {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-bottom: 12px;
  }
  .memory-card .mc-avatar {
    width: 66px; height: 66px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    overflow: hidden;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #2A2418;
    font-family: 'Anton', sans-serif;
    color: var(--gold);
    font-size: 1.3rem;
  }
  .memory-card .mc-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .memory-card .mc-name {
    font-family: 'Anton', sans-serif;
    text-transform: none;
    font-size: 1.1rem;
    color: #fff;
  }
  .memory-card .mc-years {
    font-size: 0.8rem;
    color: var(--gold);
    margin-top: 2px;
  }
  .memory-card .mc-tribute {
    font-size: 0.9rem;
    line-height: 1.6;
    color: #E5E0D0;
    font-style: italic;
  }
  .memory-card .mc-by {
    font-size: 0.74rem;
    color: #9A937E;
    margin-top: 10px;
  }
  .memory-card .mc-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(231,196,110,0.18);
  }
  .candle-btn {
    background: none;
    border: 1px solid rgba(231,196,110,0.4);
    color: var(--gold);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .candle-btn:disabled { opacity: 0.6; cursor: default; }
  .candle-btn.lit { background: rgba(231,196,110,0.15); }

  .memory-add-panel {
    display: none;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 24px;
  }
  .memory-add-panel.open { display: block; }
  .memory-add-panel h3 {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    font-size: 0.95rem;
    color: var(--gold-dim);
    margin-bottom: 14px;
  }

  .offline-note {
    font-size: 0.78rem;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 16px;
  }
</style>

</head>
